<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול – מוניטור נתב"ג</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#29363d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --scope:#29363d; --deep:#25313a; --panel:#313f47; --rule:#46565f;
  --ink:#e4e9eb; --dim:#9daab1; --faint:#71828b;
  --amber:#e8b23a; --pale:#9fcbdc; --alarm:#e0533d; --good:#7fc29b;
  --sans:'IBM Plex Sans Hebrew',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--scope);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
@media (max-width:600px){.wrap{padding:0 16px}}
.bar{position:sticky;top:0;z-index:20;background:var(--scope);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:28px;height:56px;max-width:1120px}
.brand{font-weight:700;text-decoration:none;font-size:1.05rem;white-space:nowrap}
.bar nav{display:flex;gap:22px;margin-inline-start:auto;font-size:.95rem}
.bar nav a{text-decoration:none;color:var(--dim);padding:4px 0;border-bottom:2px solid transparent;white-space:nowrap}
.bar nav a:hover,.bar nav a[aria-current]{color:var(--ink);border-bottom-color:var(--ink)}
@media (max-width:820px){.bar .wrap{height:auto;flex-wrap:wrap;gap:6px 18px;padding-block:10px}.bar nav{order:3;width:100%;margin:0;overflow-x:auto;gap:18px}}

main.wrap{padding-top:40px;padding-bottom:64px}
h1{font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.15}
.sub{color:var(--dim);margin-top:6px}
section{margin-top:44px;border-top:1px solid var(--rule);padding-top:22px}
h2{font-size:1.15rem;margin-bottom:6px}
.hint{color:var(--dim);font-size:.9rem;margin-bottom:14px;max-width:62ch}
.btn{padding:7px 18px;border:1px solid var(--ink);border-radius:2px;background:none;cursor:pointer;font-weight:500;font-size:.92rem}
.btn.pri{background:var(--ink);color:var(--scope)}
.btn.warn{border-color:var(--alarm);color:var(--alarm)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select{background:var(--deep);border:1px solid var(--rule);border-radius:2px;padding:6px 10px}
input[type=number]{width:90px;font-family:var(--mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--dim)}
.msg{margin-top:16px;padding:10px 14px;border:1px solid var(--rule);border-inline-start-width:4px;display:none}
.msg.ok{border-inline-start-color:var(--good);display:block} .msg.err{border-inline-start-color:var(--alarm);display:block}

.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.who b{font-family:var(--mono);direction:ltr}
.tag{font-size:.75rem;border:1px solid var(--amber);color:var(--amber);padding:0 8px;border-radius:2px}

.perks{list-style:none;margin:22px 0 26px;display:grid;gap:12px}
.perks li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.perks svg{width:22px;height:22px;color:var(--amber);margin-top:2px}
.perks b{display:block}
.perks span{color:var(--dim);font-size:.92rem}

.flights{list-style:none;margin-top:14px}
.flights li{display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--rule)}
.flights li:last-child{border-bottom:1px solid var(--rule)}
.flights .num{font-family:var(--mono);font-weight:500;font-size:1.05rem;direction:ltr;min-width:90px;text-align:right}
.flights .st{color:var(--dim);font-size:.9rem;flex:1}
.flights .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:1.2rem;line-height:1;padding:2px 6px}
.flights .x:hover{color:var(--alarm)}
.empty{color:var(--dim);padding:10px 0}
.danger{border-top-color:#e0533d66}
[hidden]{display:none!important}
footer{border-top:1px solid var(--rule);padding:28px 0 40px;color:var(--dim);font-size:.9rem}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:.92rem}
th,td{text-align:right;padding:8px 10px;border-top:1px solid var(--rule)}
th{color:var(--dim);font-weight:500;font-size:.82rem}
td.m{font-family:var(--mono);direction:ltr;text-align:left}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:24px}
.kpi div{padding:12px 14px;border-inline-start:1px solid var(--rule)} .kpi div:first-child{border-inline-start:0;padding-inline-start:0}
.kpi b{display:block;font-family:var(--mono);font-size:1.6rem;font-weight:500}
.kpi span{color:var(--dim);font-size:.85rem}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="index.html">מוניטור נתב"ג</a>
    <nav aria-label="ניווט ראשי">
      <a href="monitor.html">רדאר</a>
      <a href="stats.html">סטטיסטיקה</a>
      <a href="account.html">החשבון שלי</a>
      <a href="admin.html" aria-current="page">ניהול</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <h1>ניהול</h1>
  <p class="sub" id="sub">טוען…</p>
  <div class="msg" id="msg" role="status"></div>
  <div id="data" hidden>
    <div class="kpi"><div><b id="kUsers">–</b><span>משתמשים רשומים</span></div><div><b id="kFlights">–</b><span>טיסות במעקב</span></div><div><b id="kActive">–</b><span>פעילים ב-7 ימים</span></div><div><b id="kAlerts">–</b><span>עם התרעות חריגה</span></div></div>
    <table><thead><tr><th>מייל</th><th>נרשם</th><th>נראה לאחרונה</th><th>טיסות</th><th>התרעות</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</main>
<footer><div class="wrap">הדף נגיש רק למשתמשים בקבוצת admin ב-Cognito. ההרשאה נבדקת בשרת, לא רק כאן.</div></footer>
<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day = t => t ? new Date(t).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit' }) : '–';
const LV = { off: '–', unusual: 'חריגה', major: 'משמעותית' };
(async () => {
  const A = window.NatbagAuth;
  if (!A.signedIn()) { $('sub').innerHTML = 'צריך <a href="account.html">להתחבר</a> קודם.'; return; }
  try {
    const d = await A.api('GET', '/admin/users');
    $('sub').textContent = 'סקירת המשתמשים במערכת.';
    $('kUsers').textContent = d.count; $('kFlights').textContent = d.trackedFlights;
    $('kActive').textContent = d.users.filter(u => u.lastSeen && Date.now() - u.lastSeen < 7 * 864e5).length;
    $('kAlerts').textContent = d.users.filter(u => u.anomalyAlerts !== 'off').length;
    $('rows').innerHTML = d.users.map(u => `<tr><td class="m">${esc(u.email)}</td><td>${day(u.created)}</td><td>${day(u.lastSeen)}</td><td>${u.flights}</td><td>${LV[u.anomalyAlerts] || '–'}</td></tr>`).join('');
    $('data').hidden = false;
  } catch (e) {
    $('sub').textContent = e.status === 403 ? 'אין לך הרשאת מנהל.' : e.message;
  }
})();
</script>
</body>
</html>
