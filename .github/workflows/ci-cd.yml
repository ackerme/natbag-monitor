# CI/CD למוניטור נתב"ג
#  • בכל push ו-pull request: בדיקות (npm test), סריקת סודות (gitleaks), סריקת תשתית-כקוד (Checkov)
#    ובדיקות ops: Prometheus (promtool), Terraform (validate), Ansible (ansible-lint), Docker Compose
#  • הפריסה רצה רק אם הבדיקות וסריקת הסודות עברו (Security Gate)
#  • push לענף dev  → פריסה לסביבת הבדיקה (stack: natbag-staging) + smoke test
#  • push לענף main → פריסה ל-production (stack: natbag) + smoke test
# החיבור ל-AWS נעשה עם OIDC – בלי מפתחות גישה שמורים ב-GitHub.
# כל Action נעול ל-commit מדויק (SHA) ולא לתגית שאפשר להזיז – הגנה מפני מתקפת שרשרת אספקה.
# Dependabot מעדכן את ה-SHA לבד כשיוצאת גרסה חדשה.
# זרימת עבודה: מפתחים ב-dev → בודקים ב-staging → Pull Request ל-main → production.

name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: בדיקות
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --check detect.js
      - run: npm test

  secrets-scan:
    name: סריקת סודות
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # כל ההיסטוריה – גם סוד שנמחק אחר כך נשאר ב-git
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: סריקת תשתית (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write    # מפרסם את הממצאים בלשונית Security → Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkov – בדיקת template.yaml מול כללי אבטחה של AWS
        uses: bridgecrewio/checkov-action@a76233b2c1d4a820a9dc68be350c473a4a9dceec # v12
        with:
          directory: .
          framework: cloudformation,terraform,dockerfile
          soft_fail: true         # שלב 1: רק מדווח, לא חוסם. אחרי שנטפל בממצאים – נהפוך לחוסם
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - name: העלאת הממצאים ל-GitHub Security
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: checkov

  ops-checks:
    name: בדיקות ops (Prometheus, Terraform, Ansible, Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prometheus – תקינות ההגדרות, כללי ההתרעה ובדיקות היחידה שלהם
        working-directory: ops/monitoring/prometheus
        run: |
          docker run --rm --entrypoint promtool -v "$PWD:/w" -w /w prom/prometheus:v3.5.0 check config --syntax-only prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD:/w" -w /w prom/prometheus:v3.5.0 check rules rules/natbag.rules.yml
          docker run --rm --entrypoint promtool -v "$PWD:/w" -w /w/tests prom/prometheus:v3.5.0 test rules natbag.rules.test.yml
      - name: Docker Compose – תקינות + בניית ה-exporter
        working-directory: ops/monitoring
        run: |
          grep -v '^GRAFANA_ADMIN_PASSWORD=' env.example > .env && echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> .env
          docker compose config --quiet
          docker compose build exporter
      - name: Grafana – לוח הבקרה הוא JSON תקין
        run: python3 -c "import json; json.load(open('ops/monitoring/grafana/dashboards/natbag-ops.json'))"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform – פורמט ותקינות
        working-directory: ops/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ansible – lint ובדיקת תחביר
        working-directory: ops/ansible
        run: |
          pip install --quiet ansible-core==2.17.* ansible-lint==24.*
          ansible-playbook site.yml --syntax-check
          ansible-lint -c ansible-lint.yml site.yml

  deploy-staging:
    name: פריסה ל-staging
    needs: [test, secrets-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: בדיקת OIDC (מה GitHub שולח ל-AWS)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const p = JSON.parse(Buffer.from(t.split('.')[1], 'base64').toString());
            core.info(`sub=${p.sub} | aud=${p.aud} | repo=${p.repository}`);
            core.info(`role=${process.env.ROLE}`);
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: התחברות ל-AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: בדיקת Secrets
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          IVR_TOKEN: ${{ secrets.IVR_TOKEN }}
        run: |
          missing=""
          [ -z "$ALERT_EMAIL" ] && missing="$missing ALERT_EMAIL"
          [ -z "$IVR_TOKEN" ] && missing="$missing IVR_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::חסרים Secrets ב-GitHub (Settings → Secrets and variables → Actions → Secrets):$missing"
            exit 1
          fi

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: sam deploy (staging)
        working-directory: natbag-aws
        run: |
          sam deploy \
            --stack-name natbag-staging \
            --region us-east-1 \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "Stage=staging" "AlertEmail=${{ secrets.ALERT_EMAIL }}" "AllowedOrigin=*" "IvrToken=${{ secrets.IVR_TOKEN }}"

      - name: Smoke test (staging)
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name natbag-staging \
                --query "Stacks[0].Outputs[?OutputKey=='ProxyUrl'].OutputValue" --output text)
          echo "Staging proxy: $URL"
          echo "### 🧪 Staging: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "${URL}health" | tee /dev/stderr | grep -q '"stage":"staging"'
          curl -fsS "${URL}aircraft?lat=32.0055&lon=34.8854&dist=43" | head -c 300; echo
          curl -sS "${URL}flight?num=1" | head -c 400; echo

  deploy:
    name: פריסה ל-production
    needs: [test, secrets-scan]
    # רק ב-push ל-main, ורק אם הוגדר תפקיד ה-OIDC (Settings → Variables)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # נדרש ל-OIDC
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: בדיקת OIDC (מה GitHub שולח ל-AWS)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const p = JSON.parse(Buffer.from(t.split('.')[1], 'base64').toString());
            core.info(`sub=${p.sub} | aud=${p.aud} | repo=${p.repository}`);
            core.info(`role=${process.env.ROLE}`);
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: התחברות ל-AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: בדיקת Secrets
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          IVR_TOKEN: ${{ secrets.IVR_TOKEN }}
        run: |
          missing=""
          [ -z "$ALERT_EMAIL" ] && missing="$missing ALERT_EMAIL"
          [ -z "$IVR_TOKEN" ] && missing="$missing IVR_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::חסרים Secrets ב-GitHub (Settings → Secrets and variables → Actions → Secrets):$missing"
            exit 1
          fi

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: sam deploy
        working-directory: natbag-aws
        run: |
          sam deploy \
            --stack-name natbag \
            --region us-east-1 \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "Stage=prod" "AlertEmail=${{ secrets.ALERT_EMAIL }}" "BudgetLimitUSD=1" "AllowedOrigin=*" "IvrToken=${{ secrets.IVR_TOKEN }}"

      - name: Smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name natbag \
                --query "Stacks[0].Outputs[?OutputKey=='ProxyUrl'].OutputValue" --output text)
          echo "Proxy: $URL"
          curl -fsS "${URL}health"
          curl -fsS "${URL}aircraft?lat=32.0055&lon=34.8854&dist=43" | head -c 300; echo
          curl -sS "${URL}flight?num=1" | head -c 400; echo
