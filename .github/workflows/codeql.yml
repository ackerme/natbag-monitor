# CodeQL – סריקת אבטחה סטטית של הקוד (JavaScript), של GitHub. חינם ל-repo ציבורי.
# מחפש: XSS, הזרקות, שימוש לא בטוח בקלט, סודות בקוד וכו'. התוצאות: Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "30 4 * * 0"        # פעם בשבוע (ראשון 07:30 בישראל) – גם בלי שינויים, למקרה שנוספו כללים חדשים

permissions:
  contents: read

jobs:
  analyze:
    name: סריקת CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write    # כדי לפרסם את התוצאות בלשונית Security
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
