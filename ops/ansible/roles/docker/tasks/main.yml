# Docker Engine + Compose מהמאגר הרשמי של Docker (Ubuntu / Debian / Raspberry Pi OS)
- name: חבילות בסיס
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: תיקיית מפתחות
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: מפתח החתימה של Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: מאגר Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: התקנת Docker ו-Compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Docker פועל ועולה עם המחשב
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: המשתמש יכול להריץ docker בלי sudo
  ansible.builtin.user:
    name: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    groups: docker
    append: true
