# המכונות שעליהן מתקינים את מערך הניטור.
# ברירת המחדל: המחשב הנוכחי (Ubuntu בתוך WSL2 ב-Windows).
[monitoring]
localhost ansible_connection=local

# בעתיד – Raspberry Pi עם המקלט (מורידים את ה-# ומתקנים את הכתובת):
# natbag-pi ansible_host=192.168.1.50 ansible_user=pi

# ממסר השמע של שלוחה 5 (ansible-playbook relay.yml). מכונה וירטואלית ב-VirtualBox (רשת Bridged):
# מתקנים את הכתובת והמשתמש, ומורידים את ה-# בשורה של המכונה.
[relay]
# natbag-vm ansible_host=192.168.1.60 ansible_user=myuser
