# מערך הניטור של מוניטור נתב"ג: Prometheus + Grafana + exporter + בדיקות זמינות מבחוץ
# הפעלה ידנית:   cp env.example .env   (וממלאים סיסמה)   ואז   docker compose up -d --build
# או אוטומטית עם Ansible: ops/ansible
name: natbag-monitoring

services:
  exporter:
    build:
      context: ../..                       # שורש ה-repo – כדי להשתמש ב-flights.mjs של השרת
      dockerfile: ops/monitoring/exporter/Dockerfile
    environment:
      PROXY_URL: ${PROXY_URL:?חסר PROXY_URL ב-.env}
      CACHE_SECONDS: "30"
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:${AM_PORT:-9093}
    volumes:
      # נוצר על ידי Ansible (עם פרטי המייל), או ידנית:  cp alertmanager/alertmanager.example.yml alertmanager/alertmanager.yml
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:${AM_PORT:-9093}:9093"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.enable-lifecycle
      - --web.external-url=http://localhost:${PROM_PORT:-9090}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROM_PORT:-9090}:9090"]       # רק מהמחשב עצמו; הפורט ניתן לשינוי ב-.env
    depends_on: [exporter, blackbox, alertmanager]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?חסרה סיסמת Grafana ב-.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/natbag-ops.json
      # CloudWatch (לא חובה): מפתח קריאה בלבד שיוצרים לפי ops/terraform
      AWS_ACCESS_KEY_ID: ${GRAFANA_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${GRAFANA_AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]    # רק מהמחשב עצמו; אם כבר יש Grafana על 3000 – GRAFANA_PORT=3001
    depends_on: [prometheus]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  alertmanager-data:
  prometheus-data:
  grafana-data:
