# כללי התרעה. מופיעים ב-Prometheus תחת Alerts, וב-Grafana בלוח הבקרה.
# summary = מה קרה (נושא המייל) · description = מה לבדוק (בגוף המייל)
groups:
  - name: natbag-availability
    rules:
      - alert: SiteOrApiDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} לא עונה כבר 5 דקות"
          description: "לבדוק: GitHub Pages (האתר) או ה-Lambda (השרת) – ב-AWS: CloudWatch Logs של natbag-proxy, והאם ה-Kill Switch כיבה אותו."

      - alert: ApiSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} עונה לאט (יותר מ-5 שניות) כבר 10 דקות"
          description: "בדרך כלל מקור נתונים איטי (ADS-B). לבדוק בלוח הבקרה את זמני התגובה לפי endpoint."

      - alert: TlsCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "תעודת ה-TLS של {{ $labels.instance }} פגה בעוד פחות מ-14 יום"
          description: "התעודות של GitHub ו-AWS מתחדשות לבד – אם זה לא קרה, לבדוק את הדומיין."

      # ה-exporter עצמו נפל: בלעדיו כל המדדים של natbag נעלמים, וההתרעות שמבוססות עליהם לא יכולות להידלק
      - alert: ExporterDown
        expr: up{job="natbag"} == 0 or absent(up{job="natbag"})
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "ה-exporter (natbag-exporter) לא עונה כבר 5 דקות – אין מדדים"
          description: "לבדוק: docker compose ps בתיקייה ops/monitoring, ולוגים: docker compose logs exporter."

      # "לא הייתה אף תשובה תקינה ב-10 דקות" – לא מתאפס כשהשרת עונה לסירוגין
      - alert: AircraftEndpointFailing
        expr: max_over_time(natbag_api_up{endpoint="aircraft"}[10m]) == 0
        labels: { severity: critical }
        annotations:
          summary: "השרת לא מחזיר נתוני מטוסים כבר 10 דקות – כנראה כל מקורות ה-ADS-B נפלו"
          description: "לבדוק ב-CloudWatch Logs של natbag-proxy את השגיאות מול מקורות ה-ADS-B."

      # עונה לסירוגין: פחות מחצי מהבדיקות הצליחו בחצי השעה האחרונה (אבל לא נפל לגמרי – על זה יש את ההתרעה הקודמת)
      - alert: AircraftEndpointFlapping
        expr: avg_over_time(natbag_api_up{endpoint="aircraft"}[30m]) < 0.5 and max_over_time(natbag_api_up{endpoint="aircraft"}[10m]) == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "נתוני המטוסים לא יציבים – פחות מחצי מהבדיקות הצליחו ב-30 הדקות האחרונות"
          description: "מקור ADS-B כנראה נופל וחוזר. לבדוק בלוח הבקרה את natbag_api_up לאורך זמן."

      - alert: HealthcheckStale
        expr: natbag_last_healthcheck_age_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "בדיקת הזמינות ב-AWS לא רצה יותר מ-15 דקות"
          description: "לבדוק את natbag-healthcheck ב-Lambda ואת חוק ה-EventBridge שמפעיל אותו כל 5 דקות."

  - name: natbag-traffic
    rules:
      # רמת הקלטה מוכנה מראש – לגרפים מהירים
      - record: natbag:aircraft_airborne:sum
        expr: sum(natbag_aircraft)

      - alert: NoAircraftInDaytime
        # אף מטוס בטווח בשעות היום. החלון 04:00–19:00 UTC מתאים גם לשעון קיץ (07:00–22:00 בישראל)
        # וגם לשעון חורף (06:00–21:00) – כך שעון הקיץ לא מזיז את ההתרעה לשעות הלילה
        expr: natbag:aircraft_airborne:sum == 0 and on() (hour() >= 4 and hour() < 19)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "אין אף מטוס בטווח כבר 30 דקות בשעות היום – לבדוק את מקורות הנתונים"
          description: "אם נתב\"ג פעיל כרגיל – כנראה בעיה במקור הנתונים. אם המרחב האווירי סגור – זה צפוי."

      - alert: DeviationAlertsSpike
        expr: increase(natbag_deviation_alerts_today[1h]) >= 3
        labels: { severity: info }
        annotations:
          summary: "3 התרעות סטייה או יותר בשעה האחרונה"
          description: "מדד לתנועה האווירית בלבד – לא התרעה של פיקוד העורף."
