# מי מורשה לקרוא את המדדים של ה-exporter:
#   Prometheus (יגיע בצעד 15, ב-namespace monitoring) – ו-Pods עם התווית access=exporter-metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exporter-allow-metrics
  namespace: natbag
spec:
  podSelector:
    matchLabels:
      app: exporter            # החוק חל על ה-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector: {}        # מכל namespace...
          podSelector:
            matchLabels:
              access: exporter-metrics # ...אבל רק Pod עם התווית הזאת
      ports:
        - port: 9877
          protocol: TCP
