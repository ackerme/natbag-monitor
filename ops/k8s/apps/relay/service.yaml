# הממסר נגיש מהרשת הביתית: http://<כל מכונה באשכול>:30800/llbg.mp3
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: natbag
spec:
  type: NodePort
  selector:
    app: relay
  ports:
    - name: http
      port: 8000             # בתוך האשכול: relay.natbag:8000
      targetPort: http
      nodePort: 30800        # מבחוץ: פורט 30800 על כל מכונה
