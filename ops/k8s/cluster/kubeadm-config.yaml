# הגדרות למכונה הזאת (ה-Control Plane)
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 192.168.10.119   # הכתובת שה-API server מפרסם (הכרטיס של הרשת הביתית)
  bindPort: 6443                     # הפורט הסטנדרטי של Kubernetes API
nodeRegistration:
  name: master                       # שם ה-node באשכול – אותיות קטנות בלבד
  criSocket: unix:///run/containerd/containerd.sock
  kubeletExtraArgs:
    - name: node-ip                  # ה-kubelet ישתמש בכתובת הזאת ולא ב-10.0.3.15 של ה-NAT
      value: 192.168.10.119
---
# הגדרות הקמת האשכול – kubeadm init --config kubeadm-config.yaml
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.35.8          # בדיוק הגרסה של kubeadm ו-kubelet שמותקנים
clusterName: natbag
networking:
  podSubnet: 10.244.0.0/16          # כתובות ל-Pods (לא חופף לרשת הביתית 192.168.x.x)
  serviceSubnet: 10.96.0.0/12       # כתובות ל-Services (ברירת המחדל)
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd               # אותו דבר כמו SystemdCgroup = true ב-containerd (צעד 2)
